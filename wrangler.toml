name = "open-distance"
main = "src/index.ts"
compatibility_date = "2026-06-01"
account_id = "b5cdaad4db136b796354280697e0ceb9"

[vars]
DATA_VERSION = "2026-06"
# L1 (motorway) highway overlay for long-haul cross-country routes
# (NYC <-> LA-scale). Currently OFF: the 110 MB binary stays resident
# in the isolate once any request touches it, which OOMs subsequent
# L0-only requests on the same isolate (warm isolates retain state).
# Re-enable once the L1 loader does zero-copy decode in WASM linear
# memory (rust-router/ follow-up -- the buffer + scratch can live in
# the same 128 MB pool without doubling up against JS heap).
L1_ENABLED = "0"

# Rust-compiled WASM router. Built from rust-router/ via:
#   cd rust-router && cargo build --release --target wasm32-unknown-unknown
# Output is ~30 KB; imported directly in src/v2/wasm_router.ts.
# ES-module workers can't use [wasm_modules]; this rule + the import handles it.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[r2_buckets]]
binding = "GRAPH"
bucket_name = "od-graph"

[[kv_namespaces]]
binding = "CACHE"
id = "8c011eddce57493896b1c1ac9a289db4"

# Add a [[routes]] block per domain you want the Worker to serve.
# The Hostname must be a zone in your CF account.
[[routes]]
pattern = "open-distance.com"
custom_domain = true

[[routes]]
pattern = "hhapi.propspress.com"
custom_domain = true

[limits]
cpu_ms = 30000

# Per-state D1 shards (one per US state + DC). The bootstrap step provisions
# these and `scripts/materialize_wrangler.sh` substitutes each database_id.
# Bindings are accessed dynamically by the Worker as env[`GEOCODE_${state}`].

