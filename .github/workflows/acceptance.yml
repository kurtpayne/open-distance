name: Acceptance

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to probe (defaults to the production hostname)'
        required: false

jobs:
  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run acceptance probes
        env:
          # OD_API_KEY is canonical; we keep HHAPI_API_KEY working as a fallback
          # so existing fork secrets don't break on the rename.
          OD_API_KEY: ${{ secrets.OD_API_KEY || secrets.HHAPI_API_KEY }}
          OD_API_BASE: ${{ github.event.inputs.base_url || secrets.OD_API_BASE_URL || secrets.HHAPI_BASE_URL || 'https://open-distance.com' }}
        run: bash scripts/acceptance_us.sh
